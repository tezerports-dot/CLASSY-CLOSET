name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Formatting, the analyzer and the whole test suite. Runs on Linux because it
  # is quicker and none of it is platform-specific — the Windows plugins are
  # behind a Platform.isWindows guard, so the suite passes on either.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the Drift and injectable code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The installer is only worth building for something that will actually be
  # installed, so it is skipped on pull requests.
  installer:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the Drift and injectable code
        run: dart run build_runner build --delete-conflicting-outputs

      # The build stamps itself with the commit and the date, so a shop can
      # read back which build it is running. "It never changed" and "the new
      # installer never got run" look identical from the counter otherwise.
      - name: Work out the build stamp
        id: stamp
        shell: bash
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build the Windows app
        run: >
          flutter build windows --release
          --dart-define=APP_VERSION=${{ steps.stamp.outputs.version }}
          --dart-define=APP_COMMIT=${{ steps.stamp.outputs.commit }}
          --dart-define=APP_BUILT_ON=${{ steps.stamp.outputs.date }}

      - name: Package with Inno Setup
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ClassyClosetSetup
          path: installer/ClassyClosetSetup.exe
