name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Formatting, the analyzer and the whole test suite. Runs on Linux because it
  # is quicker and none of it is platform-specific — the Windows plugins are
  # behind a Platform.isWindows guard, so the suite passes on either.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the Drift and injectable code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The installer is only worth building for something that will actually be
  # installed, so it is skipped on pull requests.
  installer:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # Needed to publish the installer as a release below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the Drift and injectable code
        run: dart run build_runner build --delete-conflicting-outputs

      # The build stamps itself with the commit and the date, so a shop can
      # read back which build it is running. "It never changed" and "the new
      # installer never got run" look identical from the counter otherwise.
      - name: Work out the build stamp
        id: stamp
        shell: bash
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build the Windows app
        run: >
          flutter build windows --release
          --dart-define=APP_VERSION=${{ steps.stamp.outputs.version }}
          --dart-define=APP_COMMIT=${{ steps.stamp.outputs.commit }}
          --dart-define=APP_BUILT_ON=${{ steps.stamp.outputs.date }}

      - name: Package with Inno Setup
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ClassyClosetSetup
          path: installer/ClassyClosetSetup.exe

      # An artifact lives inside a workflow run page, behind a login, several
      # clicks from anywhere anybody would think to look. That is why the shop
      # kept running a months-old build and reporting fixes as missing. A
      # release gives every build one permanent address —
      # /releases/latest — so the newest installer is always one click away.
      - name: Publish the installer as a release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stamp.outputs.version }}
          COMMIT: ${{ steps.stamp.outputs.commit }}
          BUILT_ON: ${{ steps.stamp.outputs.date }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-${COMMIT}"
          stamp="v${VERSION} - ${COMMIT} - ${BUILT_ON}"
          {
            printf 'Windows installer for build `%s`.\n\n' "$stamp"
            printf 'Close Classy Closet before installing. Windows cannot replace the program while it is running, and an install that fails that way leaves the old version in place looking untouched.\n\n'
            printf 'After installing, open Settings. The line at the bottom should read `%s`. If it says anything else, the new build did not take.\n' "$stamp"
          } > notes.md

          # Re-running a build must not fail on an existing tag: replace the
          # asset instead, so the release always carries the newest installer.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" installer/ClassyClosetSetup.exe --clobber
            gh release edit "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" installer/ClassyClosetSetup.exe \
              --title "Classy Closet $tag" --notes-file notes.md --latest
          fi
