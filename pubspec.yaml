name: classy_closet
version: 0.1.0+1
publish_to: none
description: Offline desktop ERP/POS for retail and general stores.

environment:
  # DropdownButtonFormField.initialValue landed in the Flutter 3.35 series and
  # Color.withValues in 3.27, so the previous '>=3.4.0' floor no longer holds.
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  barcode_widget: ^2.0.4
  crypto: ^3.0.3
  drift: ^2.20.0
  equatable: ^2.0.5
  excel: ^4.0.6
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  go_router: ^14.2.7
  # Already in the tree via `pdf`; promoted to a direct dependency because the
  # thermal logo has to be decoded and reduced to one bit per dot.
  image: ^4.3.0
  injectable: ^2.4.4
  intl: ^0.19.0
  logger: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.3
  shared_preferences: ^2.3.2
  sqlite3_flutter_libs: ^0.5.24
  # 0.0.5 was never published; 0.2.1 is the current release.
  windows_printer: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Used by the backup tests to redirect path_provider at a scratch folder, so
  # a test run can never touch a real installation's data.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  injectable_generator: ^2.6.2
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
