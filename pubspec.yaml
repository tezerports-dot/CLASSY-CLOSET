name: classy_closet
version: 0.1.0+1
publish_to: none
description: Offline desktop ERP/POS for retail and general stores.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  barcode_widget: ^2.0.4
  crypto: ^3.0.3
  drift: ^2.20.0
  equatable: ^2.0.5
  excel: ^4.0.6
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  go_router: ^14.2.7
  injectable: ^2.4.4
  intl: ^0.19.0
  logger: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.3
  shared_preferences: ^2.3.2
  sqlite3_flutter_libs: ^0.5.24
  windows_printer: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  injectable_generator: ^2.6.2
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
